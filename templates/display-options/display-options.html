<!-- Sprint 148 Iteration 5: the interactive DisplayOptions Matrix (the mouse-driven wrapper of the /vpm commands).
     Design: _doco/design/sprints/148-displayOptions-diff/148-it5-design.md
     Plan:   _doco/design/sprints/148-displayOptions-diff/148-it5-round-1-implementation-plan.md
     Built by display-options.builder.js; the logic is in the pure modules displayOptionsMatrixTools.js (tools, clicks)
     and displayOptionsMatrixView.js (the table and Legend HTML).  The Tool radios are generated from TOOLS. -->
<template id="display-options-matrix-template">
    <div id="divDisplayOptionsMatrix" class="dmWidget" style="display:none;">

        <div class="dmRow dmButtons">
            <b>Display Options Matrix</b>
            <button type="button" id="btnSaveDiff_Matrix" class="riskyButton" title="SAVE Diff: stores only the controls that differ from what this Section inherits">SAVE Diff</button>
            <button type="button" id="btnSaveAll_Matrix" class="riskyButton" title="Stores every writable control value in this Section">Save All</button>
            <button type="button" id="btnUndo_Matrix" class="shadowButton" title="Undo the last Matrix/Save/Clear change (same as /vpmu)" disabled>Undo</button>
            &nbsp;&nbsp;&nbsp;
            <label class="dmCheck" title="After an edit that changes what Apply would do, apply it at once (not while the controls have unsaved changes)"><input type="checkbox" id="cbAutoApply_Matrix">Auto-apply</label>
            <button type="button" id="btnApply_Matrix" class="shadowButton" title="Re-applies this Section's DisplayOptions to the controls (same as navigating to it)">Apply</button>
            &nbsp;&nbsp;&nbsp;
            <button type="button" id="btnCurrentSectionToSongDisplayOptions" class="shadowButton" title="Copies the Current Section's STORED cells (not the live controls) into the Song-DEFAULTS row, replacing it.  Ignores all blocks.  The Section is left as it is.  Do Save All on the Section first for a full copy.">Current to Song-DEFAULTS</button>
            <button type="button" id="btnClearSongDisplayOptions" class="shadowButton" title="Empties the Song-DEFAULTS row (Sections and blocks are not touched)">Clear Song-DEFAULTS</button>
            &nbsp;&nbsp;&nbsp;
            &nbsp;&nbsp;&nbsp;
            &nbsp;&nbsp;&nbsp;
            <button type="button" id="btnFloatSection_divDisplayOptionsMatrix" class="shadowButton floatDockableButton" title="Float this Matrix in a window">F<small>loat</small></button>
            <button type="button" id="btnClose_Matrix" class="shadowButton" title="Close the Matrix (docks it first if it is floating)">Close</button>
        </div>

        <div class="dmRow dmViewOptions">
            <span class="dmRowLabel">View:</span>
            <button type="button" id="btnViewColumnGates_Matrix" class="BtnPunchedIn" title="Show or hide the column (key) gate overlay; values and cell gates always show">View Column/Key Gates</button>
            <button type="button" id="btnViewRowGates_Matrix" class="BtnPunchedIn" title="Show or hide the row (Section) gate overlay; values and cell gates always show">View Row/Section Gates</button>
        </div>

        <div class="dmRow dmToolsRow">
            <span class="dmRowLabel">Tools:</span>
            <span id="dmTools" class="dmTools" role="radiogroup" aria-label="Matrix tools"></span>
        </div>

        <div id="dmStatus" class="dmStatus" role="status" aria-live="polite"></div>

        <div id="dmScroll" class="dmScroll dmShowColGates dmShowRowGates dmTool-inspect">
            <div id="dmTableHost"></div>
        </div>

        <div class="dmRow dmLegendRow">
            <button type="button" id="btnLegend_Matrix" class="safeButton">Legend <span id="spanDisplayOptionsMatrixLegendArrow">&#x25B6;</span></button>
        </div>
        <div id="dmLegend" class="dmLegend dmShowColGates dmShowRowGates" style="display:none;"></div>
    </div>
</template>
