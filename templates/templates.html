<template id="Wiring-template">
  <div class="Wiring-controls" data-tuningID="" data-tablename="">
    <span class="thisTablename" data-tablename="tblS6_1" style="display: none;"></span>
    <label>Relative Section:</label>
    <input name="editRelativeSection" type="text" class="editRelativeSection" placeholder="Amount..."  size="6"/>
    <label for="selTablename">Instrument:</label>
    <select class="selTablename">
      <option value="">none</option>
    </select>
    <label for="selListenerProjection">Listener projection:</label>
    <select class="selListenerProjection">
      <option value="row-midi">Same string + MIDI</option>
      <option value="midi-low-to-high">MIDI only, low string to high</option>
      <option value="midi-high-to-low">MIDI only, high string to low</option>
    </select>

    <button class="btnAddWiring WiredButton WiredButtonBlocked"><s>No Instrument</s></button>
    <button class="btnMuteWiring WiringActionButton WiringActionButtonBlocked" disabled><s>MUTE</s></button>
    <button class="btnCaptureWiring WiringActionButton WiringActionButtonBlocked" disabled><s>Capture</s></button>
  </div>
</template>
