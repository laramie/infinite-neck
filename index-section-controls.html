
                <div id="divSectionControls">
                    <table class="menuTable">
                        <tr>
                            <td class="menuCaption">
                                <span class="menuCaption">Section</span>
                            </td>
                            <td class="menuPage">

                                <div class="sectionPageControlsGroup">
                                    <span id="sectionTransportButtons">
                                        <!--<button id="btnFirstSection"  type="button" >&laquo;</button>-->
                                        <button id="btnPrevSection" type="button"
                                            tabindex="-1">&lt;</button>&nbsp;&nbsp;&nbsp;<span
                                            id="lblSectionsStatus"></span>&nbsp;
                                        <button id="btnNextSection" type="button" tabindex="-1">&gt;</button>
                                        <!--<button id="btnLastSection"  type="button" >&raquo;</button>-->
                                    </span>

                                    <nobr>
                                        <span id="sectionBeatsCallout">
                                            <label for="txtBeatsPer">Beats:
                                                <input type="text" name="txtBeatsPer" id="txtBeatsPer" size="5"
                                                    value="4" readonly>
                                            </label>
                                            <button id="btnInsertFirstBeat" type="button" tabindex="-1"
                                                title="Insert First Beat">^</button>
                                            <button id="btnAddBeat" type="button" tabindex="-1"
                                                title="Add Last Beat">+</button>
                                            <button id="btnDeleteBeat" type="button" tabindex="-1"
                                                title="Delete Current Beat">-</button>
                                            &nbsp;<button id="btnPrevBeat" type="button" tabindex="-1">&laquo;</button>
                                            CurrentBeat: <span id="lblCurrentBeat">1</span>
                                            <button id="btnNextBeat" type="button" tabindex="-1">»</button>
                                            <button id="btnRecord2" class="RecordButton ArmedButton" type="button"
                                                tabindex="-1">REC</button>
                                            <button id="btnLoopBeats" class="ArmedButton" type="button"
                                                tabindex="-1">LOOP BEATS</button>
                                        </span>
                                    </nobr>
                                </div>

                                <div class="sectionPageControlsGroup">
                                    <b>Actions:</b>
                                    <div id="sectionOrder">
                                        <span class="riskyButton">
                                            <label for="dropDownSectionOrder">Destination: &sect;
                                                <select id="dropDownSectionOrder">
                                                    <option value="1" selected>1</option>
                                                    <option value="END">END</option>
                                                </select>
                                            </label>
                                        </span>
                                    </div>
                                    <div>
                                        <span id="sectionSectionButtons">
                                            <span style="float:left; ">
                                                <button id="btnNewSection" type="button">NEW
                                                    SECTION<small><br>blank</small></button>
                                                <button id="btnAddShallowCloneSection" type="button">SHALLOW
                                                    CLONE<small><br>namedNotes only</small></button>
                                                <button id="btnAddDeepCloneSection" type="button">CLONE<small><br>all
                                                        notes/beats</small></button>
                                                <button id="btnMoveSectionOrder" type="button">Move Section</button>
                                            </span>

                                            <span style="float:left; ">
                                                <button id="btnDeleteSection" class="riskyButton" type="button">DELETE
                                                    CURRENT<small><br>This Section!</small></button>
                                            </span>
                                            <span style="float:left; ">
                                                <button id="btnControlsToDisplayOptions" class="riskyButton"
                                                    type="button">SAVE display options<small><br>this section
                                                        forward</small></button>
                                            </span>
                                            <span style="float:left; ">
                                                <button id="btnDeleteDisplayOptions" class="riskyButton"
                                                    type="button">CLEAR display options<small><br>this
                                                        section</small></button>
                                            </span>
                                        </span>


                                    </div>
                                </div>

                                <div class="sectionPageControlsGroup">
                                    <!-- WIDGET-EXAMPLE("TextWButtonWidget", "Caption") -->
                                    <nobr>
                                        <label for="txtCaption">Caption:
                                            <nobr><input type="text" name="txtCaption" id="txtCaption" value=""
                                                    size="64"><button type="button">&check;</button></nobr>
                                        </label>
                                    </nobr>
                                    <!-- END-WIDGET-EXAMPLE("TextWButtonWidget") -->
                                </div>

                                <div class="sectionPageControlsGroup">
                                    <nobr>
                                        <!-- WIDGET-EXAMPLE("SelectWidget", "Root") -->
                                        <label for="dropDownRoot">
                                            <nobr><u><b>K</b></u>ey:</nobr>
                                            <select id="dropDownRoot">
                                                <option value="0">A</option>
                                                <option class="ddnBb" value="1">Bb</option>
                                                <option value="2">B</option>
                                                <option value="3" selected>C</option>
                                                <option class="ddnDb" value="4">Db</option>
                                                <option value="5">D</option>
                                                <option class="ddnEb" value="6">Eb</option>
                                                <option value="7">E</option>
                                                <option value="8">F</option>
                                                <option class="ddnGb" value="9">Gb</option>
                                                <option value="10">G</option>
                                                <option class="ddnAb" value="11">Ab</option>
                                            </select>
                                        </label>
                                        <!-- END-WIDGET-EXAMPLE("SelectWidget") -->
                                        &nbsp;&nbsp;
                                        <label for="dropDownRootLead">
                                            LeadKey:
                                            <select id="dropDownRootLead">
                                                <option value="-1">root</option>
                                                <option value="0">A</option>
                                                <option class="ddnBb" value="1">Bb</option>
                                                <option value="2">B</option>
                                                <option value="3" checked>C</option>
                                                <option class="ddnDb" value="4">Db</option>
                                                <option value="5">D</option>
                                                <option class="ddnEb" value="6">Eb</option>
                                                <option value="7">E</option>
                                                <option value="8">F</option>
                                                <option class="ddnGb" value="9">Gb</option>
                                                <option value="10">G</option>
                                                <option class="ddnAb" value="11">Ab</option>
                                            </select>
                                        </label>

                                        &nbsp;&nbsp;&nbsp;<button class="safeButton" id="btnFlats"
                                            type="button">Flats</button>
                                        <button id="btnSharps" class="safeButton" type="button">Sharps</button>
                                    </nobr>

                                </div>

                                <div class="sectionPageControlsGroup">
                                    <nobr>
                                        <button id="btnTransposeUp" type="button"
                                            class="riskyButton"><b><u>t</u></b>ranspose up</button>
                                        <button id="btnTransposeDown" type="button"
                                            class="riskyButton"><b><u>T</u></b>ranspose down</button>
                                        <button id="btnTransposeJumpUp" type="button"
                                            class="riskyButton"><b><u>j</u></b>ump up</button>
                                        <button id="btnTransposeJumpDown" type="button"
                                            class="riskyButton"><b><u>J</u></b>ump down</button>
                                    </nobr>
                                    <nobr><label for="cbTransposeNotes"><input id="cbTransposeNotes" type="checkbox"
                                                name="cbnTransposeNotes" value="1">Allow transposition by keyboard
                                            shortcuts <b><u>d</u></b>, <b><u>U</u></b>, <b><u>u</u></b>,
                                            <b><u>D</u></b>, <b><u>&nbsp;j&nbsp;</u></b>, &amp; <b><u>J</u></b>
                                        </label>
                                    </nobr>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
